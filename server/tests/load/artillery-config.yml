# Artillery load profile for the visitor-tracking journey.
# Run: artillery run server/tests/load/artillery-config.yml --target "$BASE_URL"
config:
  target: "http://localhost:5000"
  http:
    timeout: 10
  phases:
    - duration: 30
      arrivalRate: 5
      name: "Warm up"
    - duration: 120
      arrivalRate: 10
      name: "Sustained load"
    - duration: 60
      arrivalRate: 20
      name: "Spike test"
  plugins:
    expect: {}
  ensure:
    p95: 800
    maxErrorRate: 2

scenarios:
  - name: "Complete visitor journey"
    weight: 70
    flow:
      - post:
          url: "/api/tracking/session"
          json:
            referrer: "https://example.com"
            campaign: "load-test"
          capture:
            - json: "$.sessionId"
              as: "sessionId"
          expect:
            - statusCode: 200
      - think: 1
      - post:
          url: "/api/tracking/pageview"
          json:
            sessionId: "{{ sessionId }}"
            page: "/"
            title: "Home"
            timeSpent: 30000
            scrollDepth: 75
      - think: 1
      - post:
          url: "/api/tracking/event"
          json:
            sessionId: "{{ sessionId }}"
            eventType: "click"
            eventData:
              element: "project-card"
      - post:
          url: "/api/tracking/session/end"
          json:
            sessionId: "{{ sessionId }}"

  - name: "Read-heavy dashboard"
    weight: 30
    flow:
      - get:
          url: "/health"
      - get:
          url: "/api/health"
