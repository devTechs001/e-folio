services:
  # Backend API Service
  - type: web
    name: e-folio-backend-server
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && corepack enable && pnpm install
    startCommand: cd server && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://e-folio-pro.netlify.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        value: AIzaSyA7IS5Auefu-2Y2L3P2ooEfNTGbD8LpYn8
      - key: GOOGLE_API_KEY
        value: AIzaSyA7IS5Auefu-2Y2L3P2ooEfNTGbD8LpYn8

