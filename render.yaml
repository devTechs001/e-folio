services:
  # Backend API Service
  - type: web
    name: e-folio-backend-server
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && corepack enable && pnpm install
    startCommand: cd server && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://e-folio-pro.netlify.app
      - key: MONGODB_URI
        sync: false
      # Secrets are set in the Render dashboard, never committed to the repo.
      - key: JWT_SECRET
        sync: false
      # Phase 32: owner/admin sign-in credentials live ONLY in the Render
      # environment. No value is ever committed here. See
      # RENDER_AUTH_ENV_SETUP.md for the exact variables and setup steps.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

# ============================================
# DEPLOYMENT NOTES
# ============================================
# Frontend: https://e-folio-pro.netlify.app (Netlify) 
# Backend: https://e-folio-backend-server.onrender.com (Render) 
#
#  Full deployment guide: See DEPLOYMENT_GUIDE.md
#  Using pnpm for dependency management to match project setup
#
# Deploy Command:
# git add . && git commit -m "Deploy" && git push origin main
