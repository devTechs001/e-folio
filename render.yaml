services:
  # Backend API Service
  - type: web
    name: e-folio-backend-server
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install --legacy-peer-deps
    startCommand: cd server && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://e-folio-pro.netlify.app
      - key: MONGODB_URI
        sync: false  # ⚠️ SECURITY: Add manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # ⚠️ SECURITY: Add manually in Render dashboard
      - key: OWNER_EMAIL
        value: devtechs842@gmail.com
      - key: OWNER_PASSWORD
        sync: false  # ⚠️ SECURITY: Add manually in Render dashboard
      - key: OWNER_NAME
        value: Portfolio Owner

