<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <script type="text/javascript">
    // redirect to the SPA route if not on a static asset
    if (window.location.pathname !== '/' && !window.location.pathname.match(/\.(js|css|png|jpg|jpeg|gif|svg|ico)$/)) {
      window.location.pathname = '/';
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
