# Netlify Configuration for E-Folio Pro
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm install && npm run build"
  publish = "dist"
  base = ""

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "9"
  GITHUB_PAGES = "false"

# SPA Redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# API Proxy to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://e-folio-backend-server.onrender.com/api/:splat"
  status = 200
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://e-folio-backend-server.onrender.com wss://e-folio-backend-server.onrender.com;"

# Cache Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Forms Configuration
# Add data-netlify="true" to your form tag in HTML
# Example: <form name="contact" method="POST" data-netlify="true">

# Functions (if needed for serverless)
# [functions]
#   directory = "netlify/functions"

# Plugins
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Context-specific settings
[context.production.environment]
  VITE_API_URL = "https://e-folio-backend-server.onrender.com/api"
  VITE_SOCKET_URL = "https://e-folio-backend-server.onrender.com"
  VITE_ENABLE_ANALYTICS = "true"
  VITE_ENABLE_FORMS = "true"

[context.deploy-preview.environment]
  VITE_API_URL = "https://e-folio-backend-server.onrender.com/api"
  VITE_SOCKET_URL = "https://e-folio-backend-server.onrender.com"
  VITE_ENABLE_ANALYTICS = "false"
  VITE_ENABLE_FORMS = "true"

[context.branch-deploy.environment]
  VITE_API_URL = "https://e-folio-backend-server.onrender.com/api"
  VITE_SOCKET_URL = "https://e-folio-backend-server.onrender.com"
  VITE_ENABLE_ANALYTICS = "false"
  VITE_ENABLE_FORMS = "true"

# Dev server
[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"
  autoLaunch = false
